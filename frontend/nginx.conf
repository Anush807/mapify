server {
  listen       80;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # Serving the app and the API from one origin means the httpOnly auth cookie
  # needs no CORS or SameSite negotiation — same arrangement as the Vite dev proxy.
  location /api/ {
    proxy_pass         http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Roadmap generation runs ~20s on Gemini, and a validation retry can double
    # that. nginx's 60s default would cut the request off mid-generation.
    proxy_connect_timeout 10s;
    proxy_send_timeout   180s;
    proxy_read_timeout   180s;
  }

  # Vite emits content-hashed filenames, so these can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: deep links like /roadmap/:id and /verify-email?token=...
  # are client-side routes and must return index.html, not 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
